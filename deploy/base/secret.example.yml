# Template for the Secrets you must create manually before
# `kubectl apply -k deploy/overlays/prod`.
#
# 1. .env file (REQUIRED) — contains a `.env` key with KEY=VALUE lines.
#
#    Create it locally with:
#      kubectl create secret generic fcm-worker-secrets \
#        --from-file=.env=./.env \
#        -n prod
#
#    The .env file should contain:
#      # --- Database (MySQL on the VPS) ---
#      DB_HOST=192.168.20.240          # local network (matches actual production DB)
#      DB_PORT=3306
#      DB_NAME=tomanotas
#      DB_USER=root
#      DB_PASSWORD=<your-mysql-password>
#
#      # --- Firebase Cloud Messaging ---
#      GOOGLE_APPLICATION_CREDENTIALS=/secrets/firebase-sa.json
#
#      # --- App settings ---
#      APP_TIMEZONE=America/Bogota
#
#    Note: the CronJob uses `hostNetwork: true`, so the pod sees MySQL on
#    `127.0.0.1` of the host. The .env above uses the local-network IP for
#    `--from-file` uploads; change `DB_HOST` to `127.0.0.1` if you want the
#    pod to talk to the host directly.
#
# 2. FCM service account (REQUIRED):
#
#      kubectl create secret generic fcm-credentials \
#        --from-file=firebase-sa.json=./secrets/firebase-sa.json \
#        -n prod
#
#    The service account JSON is obtained from:
#      Firebase Console → Project `mobile-notifications-me`
#      → ⚙️ Project Settings → Service Accounts → Generate new private key
#
#    Do NOT commit the firebase-sa.json file. It is in .gitignore.
